<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="SheetStack - swipe-ready cheat sheets for developers" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SheetStack</title>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#3ea6ff"/>
      <stop offset="1" stop-color="#35e0a1"/>
    </linearGradient>
    <linearGradient id="gl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.55" stop-color="#3ea6ff"/>
      <stop offset="1" stop-color="#35e0a1"/>
    </linearGradient>
    <style>
      .title{fill:#f5f7ff}
      .sub{fill:#9aa6bd}
      .track{fill:#2a3347}
      @media (prefers-color-scheme: light){
        .title{fill:#0f172a}
        .sub{fill:#4b5a73}
        .track{fill:#cfd6e4}
      }
      text{font-family:'DejaVu Sans','Segoe UI',Verdana,system-ui,sans-serif}
    </style>
  </defs>

  <g id="content" transform="translate(88,0)">
  <!-- stacked pages icon -->
  <rect x="62" y="96" width="112" height="152" rx="20" fill="url(#g)" opacity="0.30"/>
  <rect x="86" y="78" width="112" height="152" rx="20" fill="url(#g)" opacity="0.55"/>
  <rect x="110" y="60" width="112" height="152" rx="20" fill="url(#g)"/>
  <g fill="#ffffff">
    <rect x="128" y="84" width="44" height="10" rx="5" opacity="0.95"/>
    <rect x="128" y="108" width="76" height="12" rx="6" opacity="0.85"/>
    <rect x="128" y="130" width="76" height="12" rx="6" opacity="0.85"/>
    <rect x="128" y="152" width="76" height="12" rx="6" opacity="0.85"/>
    <rect x="128" y="174" width="52" height="12" rx="6" opacity="0.85"/>
  </g>

  <!-- title -->
  <text class="title" x="262" y="136" font-size="84" font-weight="700">SheetStack</text>
  <text class="sub" x="264" y="182" font-size="28">Swipe-ready cheat sheets for developers</text>

  <!-- progress line like the sheets -->
  <rect class="track" x="264" y="204" width="700" height="4" rx="2"/>
  <rect x="264" y="204" width="168" height="4" rx="2" fill="url(#gl)"/>

  <!-- pills -->
  <g font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="264" y="228" width="124" height="40" rx="14" fill="#6a4df0"/>
    <text x="326" y="256">15 pages</text>
    <rect x="404" y="228" width="170" height="40" rx="14" fill="#2f7fd6"/>
    <text x="489" y="256">1080 × 1920</text>
    <rect x="590" y="228" width="160" height="40" rx="14" fill="#1fae7c"/>
    <text x="670" y="256">PDF ready</text>
  </g>
  </g>
</svg>
